[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soberx"
version = "1.0.0"
description = "SoberX — открытый клиент Roblox для Linux с поддержкой кастомных APK"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.48"]

[project.scripts]
soberx = "soberx.cli:main"
soberx-gui = "soberx.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
