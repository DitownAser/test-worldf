# Конфигурация фильтров для MegaLinter v10.1.0
FLAVOR_SUGGESTIONS: false

# Разрешаем сканеру Zizmor безопасно использовать GITHUB_TOKEN для анализа API
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

DISABLE:
  - SPELL_CSPELL       # ОТКЛЮЧАЕМ cspell: убирает 3930 ложных ошибок на русский язык в коде
  - REPOSITORY_GRYPE   # ОТКЛЮЧАЕМ grype: он падал из-за нехватки места на диске контейнера

DISABLE_LINTERS:
  - COPYPASTE_JSCPD    # ОТКЛЮЧАЕМ jscpd: ломает сборку из-за неверного файла .jscpd.json
