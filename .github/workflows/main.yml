name: Quality Check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions: read-all

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
      pull-requests: write # Исправлено: через дефис, без "s" на конце

    steps:
      # 1. Скачиваем код вашего проекта
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Запускаем MegaLinter
      - name: MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          DISABLE_SECURITY: true
          APPLY_FIXES: all
          APPLY_FIXES_EVENT: pull_request
          APPLY_FIXES_MODE: commit
