name: MegaLinter

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions: read-all

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    
    # Даем боту права писать комментарии и заливать автоисправления стиля кода
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # 1. Скачиваем код проекта
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Проверяет только измененные файлы, экономя минуты

      # 2. Запускаем MegaLinter v10.1.0 с передачей токена
      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10.1.0
        env:
          # Передаем системный токен во внутреннее окружение линтера
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true # Сканировать только новые изменения
          DISABLE_SECURITY: true       # Игнорировать уязвимости, фокус на качестве кода
          APPLY_FIXES: all             # Автоматически исправлять опечатки форматирования
          APPLY_FIXES_EVENT: pull_request
          APPLY_FIXES_MODE: commit

