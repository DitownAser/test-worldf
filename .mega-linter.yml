# Конфигурация MegaLinter для этого репозитория
# Источник проблем: false positive для Rust/Python/CLI артефактов,
# ограничения GitHub Actions по памяти и шум от cspell/devskim.
FLAVOR_SUGGESTIONS: false

# Разрешаем Zizmor безопасно использовать GITHUB_TOKEN
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Отключаем линтеры, которые системно падают в контейнере Actions
DISABLE:
  - SPELL_CSPELL
  - REPOSITORY_GRYPE
  - REPOSITORY_DEVSKIM

# JSCPD должен читаться из кастомного конфига, а не падать на generated artifacts
DISABLE_LINTERS:
  - COPYPASTE_JSCPD

JSCPD_CONFIG_FILE: .jscpd.json
